[project]
name = "incidentops-ai"
version = "0.1.0"
description = "Production-grade AI incident triage and diagnosis"
readme = "README.md"
authors = [
    { name = "Aniket Indulkar", email = "aniketindulkar.ms@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
incidentops-ai = "incidentops_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["apps/api"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# docs/ holds prose with illustrative (sometimes deliberately wrong) Python snippets.
extend-exclude = ["docs"]

[tool.ruff.lint.isort]
known-first-party = ["app", "incidentops_ai"]
