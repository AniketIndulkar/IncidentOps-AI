# Synthetic service catalogue for the IncidentOps corpus (W05, AIENG-34 and AIENG-35).
#
# What a service registry would hold: teams, people, services and their dependencies, incidents and
# their fixes, and which runbooks cover which services. Facts stated in the corpus are kept as written
# (checkout-api depends on the payments-gateway circuit breaker, orders-api on orders-db, …); the rest
# is consistent with it. Every person is fictional. Validated against data/corpus by the tests.

