# ── Fixes: what was done (mitigation) or decided (prevention), from the postmortems ──────────────────
# status: done or open, as the postmortem states it; an action item not marked done is open.

[[fixes]]
id = "fix-kafka-renew-cert"
incident = "pm-2026-02-kafka"
service = "kafka"
kind = "mitigation"
status = "done"
description = "Renew the broker certificate and roll the brokers one at a time."

[[fixes]]
id = "fix-kafka-cert-manager"
incident = "pm-2026-02-kafka"
service = "kafka"
kind = "prevention"
status = "open"
description = "Move the broker certificate to cert-manager and alert 21 days before any expiry."

[[fixes]]
id = "fix-kafka-runbook-cert-check"
incident = "pm-2026-02-kafka"
service = "notification-worker"
kind = "prevention"
status = "done"
description = "Add the certificate end date check to the notification-worker runbook."

[[fixes]]
id = "fix-kafka-page-faster"
incident = "pm-2026-02-kafka"
service = "notification-worker"
kind = "prevention"
status = "open"
description = "Page after 10 minutes of NoBrokersAvailable instead of 60."

[[fixes]]
id = "fix-checkout-rollback"
incident = "pm-2026-03-checkout"
service = "checkout-api"
kind = "mitigation"
status = "done"
description = "Roll back to v2.30.4."

[[fixes]]
id = "fix-checkout-keepalive-check"
incident = "pm-2026-03-checkout"
service = "checkout-api"
kind = "prevention"
status = "done"
description = "Fail at startup when the application keepalive is not longer than the sidecar's."

[[fixes]]
id = "fix-checkout-release-notes"
incident = "pm-2026-03-checkout"
service = "checkout-api"
kind = "prevention"
status = "open"
description = "Put configuration changes in a dedicated section of the release notes template."

[[fixes]]
id = "fix-orders-rollback"
incident = "pm-2026-05-orders-pool"
service = "orders-api"
kind = "mitigation"
status = "done"
description = "Roll back the release that leaked transactions."

[[fixes]]
id = "fix-orders-idle-timeout"
incident = "pm-2026-05-orders-pool"
service = "orders-db"
kind = "prevention"
status = "done"
description = "Set idle_in_transaction_session_timeout to 120 seconds on the orders database."

[[fixes]]
id = "fix-orders-lint"
incident = "pm-2026-05-orders-pool"
service = "orders-api"
kind = "prevention"
status = "open"
description = "Add a lint rule rejecting early returns inside open transactions."

[[fixes]]
id = "fix-orders-pgbouncer"
incident = "pm-2026-05-orders-pool"
service = "orders-db"
kind = "prevention"
status = "open"
description = "Deploy PgBouncer in transaction mode in front of the primary."

[[fixes]]
id = "fix-payments-failover"
incident = "pm-2026-06-payments"
service = "payments-gateway"
kind = "mitigation"
status = "done"
description = "Fail the region over to the secondary acquirer."

[[fixes]]
id = "fix-payments-circuit-breaker"
incident = "pm-2026-06-payments"
service = "payments-gateway"
kind = "prevention"
status = "open"
description = "Add a per-acquirer circuit breaker that opens after 10 timeouts in 30 seconds."

[[fixes]]
id = "fix-payments-alert-labels"
incident = "pm-2026-06-payments"
service = "payments-gateway"
kind = "prevention"
status = "open"
description = "Add region and acquirer to the alert text."

[[fixes]]
id = "fix-search-batch-size"
incident = "pm-2026-07-search"
service = "search-indexer"
kind = "mitigation"
status = "done"
description = "Lower INDEXER_BATCH_SIZE to 500 until the streaming change shipped."

[[fixes]]
id = "fix-search-stream-metadata"
incident = "pm-2026-07-search"
service = "search-indexer"
kind = "prevention"
status = "done"
description = "Stream image metadata instead of loading it."

[[fixes]]
id = "fix-search-oom-ticket"
incident = "pm-2026-07-search"
service = "search-indexer"
kind = "prevention"
status = "done"
description = "Treat three OOMKilled restarts in an hour as a ticket, not noise."

[[fixes]]
id = "fix-session-chrony"
incident = "pm-2026-08-session"
service = "session-service"
kind = "mitigation"
status = "done"
description = "Restart chrony on the affected nodes and cordon them."

[[fixes]]
id = "fix-session-offset-alert"
incident = "pm-2026-08-session"
service = "session-service"
kind = "prevention"
status = "done"
description = "Alert on node_timex_offset_seconds above 30 seconds."

[[fixes]]
id = "fix-session-failover-test"
incident = "pm-2026-08-session"
service = "redis-sessions"
kind = "prevention"
status = "open"
description = "Test Redis failover in staging every quarter, with a login check."

[[fixes]]
id = "fix-billing-pause-job"
incident = "pm-2026-09-billing"
service = "billing-service"
kind = "mitigation"
status = "done"
description = "Pause the renewal job."

[[fixes]]
id = "fix-billing-hotfix"
incident = "pm-2026-09-billing"
service = "billing-service"
kind = "mitigation"
status = "done"
description = "Hot fix the retry helper."

[[fixes]]
id = "fix-billing-key-test"
incident = "pm-2026-09-billing"
service = "billing-service"
kind = "prevention"
status = "open"
description = "Derive the key from invoice id and period, with a test that retries reuse it."

[[fixes]]
id = "fix-billing-monitor"
incident = "pm-2026-09-billing"
service = "billing-service"
kind = "prevention"
status = "open"
description = "Run the duplicate-charge monitor every 5 minutes."

